<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Heading Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background: rgb(240, 244, 248);
        }
        h1 {
            color: rgb(44, 62, 80);
            font-size: 36px;
            margin-bottom: 30px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: rgb(52, 152, 219);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: rgb(41, 128, 185);
        }
    </style>
</head>
<body>
    <h1 id="mainHeading">Hello! Welcome</h1>
    <button id="changeBtn">Change Text</button>
    <script src="script.js"></script>
</body>
</html>
