<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-container">
        <h1>Responsive Image Gallery</h1>
        <div class="gallery-grid">
            <div class="gallery-item">
                <svg width="100%" height="200">
                    <rect width="100%" height="100%" fill="rgb(52, 152, 219)"/>
                    <text x="50%" y="50%" fill="white" font-size="20" text-anchor="middle" dominant-baseline="middle">Campus View</text>
                </svg>
                <div class="caption">College Campus</div>
            </div>
            <div class="gallery-item">
                <svg width="100%" height="200">
                    <rect width="100%" height="100%" fill="rgb(46, 204, 113)"/>
                    <text x="50%" y="50%" fill="white" font-size="20" text-anchor="middle" dominant-baseline="middle">Computer Lab</text>
                </svg>
                <div class="caption">Advanced Computing Lab</div>
            </div>
            <div class="gallery-item">
                <svg width="100%" height="200">
                    <rect width="100%" height="100%" fill="rgb(230, 126, 34)"/>
                    <text x="50%" y="50%" fill="white" font-size="20" text-anchor="middle" dominant-baseline="middle">Library</text>
                </svg>
                <div class="caption">Central Digital Library</div>
            </div>
            <div class="gallery-item">
                <svg width="100%" height="200">
                    <rect width="100%" height="100%" fill="rgb(155, 89, 182)"/>
                    <text x="50%" y="50%" fill="white" font-size="20" text-anchor="middle" dominant-baseline="middle">Auditorium</text>
                </svg>
                <div class="caption">College Seminar Hall</div>
            </div>
        </div>
    </div>
</body>
</html>
