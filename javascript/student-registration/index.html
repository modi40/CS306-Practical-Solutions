<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-card">
        <h1>Student Registration</h1>
        <form action="" method="post">
            <div class="field">
                <label for="rollno">Roll Number:</label>
                <input type="number" id="rollno" name="rollno" required min="1" max="99999">
            </div>
            <div class="field">
                <label for="stuname">Student Name:</label>
                <input type="text" id="stuname" name="stuname" required minlength="2" maxlength="50">
            </div>
            <div class="field">
                <label for="stuemail">Student Email:</label>
                <input type="email" id="stuemail" name="stuemail" required>
            </div>
            <div class="field">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required min="16" max="35">
            </div>
            <div class="field">
                <label for="department">Department:</label>
                <select id="department" name="department" required>
                    <option value="">Select Department</option>
                    <option value="cs">Computer Science</option>
                    <option value="it">Information Technology</option>
                    <option value="math">Mathematics</option>
                </select>
            </div>
            <input type="submit" value="Register Now" class="submit-btn">
        </form>
    </div>
</body>
</html>
